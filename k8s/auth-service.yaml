apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: student-performance
spec:
  selector:
    app: auth-service
  ports:
    - name: http
      port: 4000
      targetPort: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: student-performance
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: auth-service
          image: student-performance/auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: CLIENT_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: CLIENT_URL
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: NODE_ENV
            - name: FIREBASE_PROJECT_ID
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: FIREBASE_PROJECT_ID
            - name: DATA_SERVICE_URL
              value: "http://data-service:4100"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MONGO_URI
            - name: AUTH_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: AUTH_SERVICE_SECRET
          readinessProbe:
            httpGet:
              path: /healthz
              port: 4000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 384Mi